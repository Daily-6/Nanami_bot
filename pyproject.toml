[project]
name = "nanami_bot"
version = "0.1.0"
description = "nanami_bot"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2[websockets]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-multincm>=1.3.1",
    "nonebot-plugin-gpt-sovits>=0.2.0",
]

[tool.nonebot]
plugin_dirs = ["src/plugins"]
builtin_plugins = []

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]

[tool.nonebot.plugins]
nonebot-plugin-multincm = ["nonebot_plugin_multincm"]
nonebot-plugin-gpt-sovits = ["nonebot_plugin_gpt_sovits"]

# The legacy NoneBot dependency list above is retained solely for rollback.
# AstrBot deployment uses requirements.txt and setup_astrbot.ps1 instead.
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

